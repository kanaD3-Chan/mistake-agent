[package]
name = "mistake-agent"
version = "0.1.0"
edition = "2024"
description = "Mistake Agent v2：面向中学生的本地错题管理 + 辅助学习 Agent"

[lib]
name = "mistake_agent"
path = "src/lib.rs"

[[bin]]
name = "mistake-agent"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
dunce = "1.0.5"
flexi_logger = "0.31.9"
futures-core = "0.3.33"
futures-util = "0.3.33"
# 关掉默认 feature：它的 default 会打开 resolve-http → reqwest → rustls → aws-lc-rs
# → aws-lc-sys（C 代码），在含非 ASCII 的工作区路径下必然编译失败。
# 我们只用 `validator_for` 做本地校验（src/kernel/agent/dispatch.rs），不需要远程 $ref。
jsonschema = { version = "0.49.3", default-features = false }
log = "0.4.33"
pdf-extract = "0.12.0"
# Windows 原生 TLS（schannel）：刻意不用 rustls —— 它会拖进 aws-lc-sys（C 代码），
# 而本机工作区路径含非 ASCII 字符，C 编译必然失败，导致 cargo clean 后无法重建。
# 与服务端同一处理（ADR-0047 修订 R11）。
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "stream"] }
rfd = "0.17.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["protocol-asset"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
