name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Use official Ubuntu apt mirrors
        # GitHub ubuntu-latest runner image 默认 /etc/apt/sources.list 带
        # azure.archive.ubuntu.com (azure region 镜像，常不通)。
        # /etc/apt/sources.list.d/ 还有 microsoft / google-chrome 等第三方源。
        # 还可能有 /etc/apt/apt-mirrors.txt (Mirrorlist 类型，与 sources.list 独立)。
        # Ubuntu 24.04 的新格式 .sources 我之前的 `*.list` glob 也抓不到。
        # nuke 全部，只留我们写的官方 archive.ubuntu.com。
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/*.list
          sudo rm -f /etc/apt/sources.list.d/*.sources
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/sources.list > /dev/null <<'EOF'
          deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          EOF

      - name: Cache apt archives
        # 只 cache .deb 归档 (大文件)，不 cache /var/lib/apt (源 index，
        # 小且与 sources 强相关——sources 变就废)。暖启 install 秒过。
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-v1
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # 防御性：timeout 10s 兜底（万一官方源也慢）。
        # --no-install-recommends 跳过推荐包。
        run: |
          sudo apt-get update -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            file

      - name: Cache tauri-cli binary
        # tauri-cli 是独立 crate，`cargo install` 每次编 2-3 min。
        # 按 runner OS 缓存；key 固定为 2.x，想强制 invalidate 时改 -v1 → -v2。
        # 跨平台：靠 actions/cache 的 `outputs.cache-hit` 判定，
        # 不写 shell 脚本（避免 Windows pwsh / Linux bash 语法差异）。
        #
        # path 用 OS 条件分支：actions/cache 的语义是 list 里所有路径都存在
        # 才保存；列两个 → 各自平台有一个不存在 → "Path Validation Error"，
        # 不保存。所以单平台只列一个。
        #
        # 关键：`cargo install tauri-cli` 装的是 cargo 子命令二进制
        # `cargo-tauri[.exe]`，不是 `tauri[.exe]`。`cargo tauri build` 通过
        # cargo 子命令机制自动找它。`tauri` 单独可执行不存在。
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/.cargo/bin/cargo-tauri.exe' || '~/.cargo/bin/cargo-tauri' }}
          key: tauri-cli-${{ runner.os }}-2.x-v1

      - name: Install tauri-cli (skip if cached)
        # `cargo tauri build` 在 `make bundle` 中调用；runner 默认没装 tauri-cli，
        # 需 cargo install（Cargo.toml 只包含 tauri-build 作为 build dep）。
        # cache-hit == 'true' 时 skip → 暖启省 2-3 min。
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0"

      - name: Verify tauri-cli install
        # 诊断：cargo install 跑完 cargo-tauri 到底装到哪、cargo tauri --version
        # 能否 invoke。`continue-on-error` 是为了不让 verify 把 job 红掉——
        # 真坏了 make bundle 自己会报"no such command"。
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        shell: bash
        continue-on-error: true
        run: |
          echo "--- cargo tauri --version ---"
          cargo tauri --version 2>&1 || echo "WARN: cargo tauri --version failed"
          echo "--- ls ~/.cargo/bin/ ---"
          ls -la ~/.cargo/bin/cargo-tauri* 2>&1 || echo "WARN: no cargo-tauri* in ~/.cargo/bin/"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
        shell: pwsh

      - name: Cache Pyodide wheel
        uses: actions/cache@v4
        with:
          path: web/node_modules/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pyodide-${{ runner.os }}-

      - name: Verify tools
        run: make check-tools

      - name: Build frontend
        # tauri::generate_context!() 编译期需要 web/dist 存在 (proc macro 嵌入
        # 前端资源)，必须先于 cargo test / clippy。Makefile 增量，cache hit
        # 时是 no-op；冷启要拉 Pyodide 离线 wheel ~30-60s。
        run: make build-frontend

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build Rust release
        run: make build-rust

      - name: Build platform bundle
        run: make bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: |
            target/release/bundle/
            target/release/mistake-agent*
          if-no-files-found: warn
          retention-days: 14
