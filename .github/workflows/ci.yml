name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            file

      - name: Cache tauri-cli binary
        # tauri-cli 是独立 crate，`cargo install` 每次编 2-3 min。
        # 按 runner OS 缓存到 ~/.cargo/bin/tauri[.exe]；key 固定为 2.x，
        # 想强制 invalidate 时改 -v1 → -v2。
        # 跨平台：靠 actions/cache 的 `outputs.cache-hit` 判定是否要 install，
        # 不写 shell 脚本（避免 Windows pwsh / Linux bash 语法差异）。
        #
        # path 用 OS 条件分支：actions/cache 的语义是 list 里所有路径都存在
        # 才保存；列两个（tauri + tauri.exe）→ 各自平台有一个不存在 →
        # "Path Validation Error"，不保存。所以单平台只列一个。
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/.cargo/bin/tauri.exe' || '~/.cargo/bin/tauri' }}
          key: tauri-cli-${{ runner.os }}-2.x-v1

      - name: Install tauri-cli (skip if cached)
        # `cargo tauri build` 在 `make bundle` 中调用；runner 默认没装 tauri-cli，
        # 需 cargo install（Cargo.toml 只包含 tauri-build 作为 build dep）。
        # cache-hit == 'true' 时 skip → 暖启省 2-3 min。
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0"

      - name: Verify tauri-cli install
        # 诊断：cargo install 跑完 tauri 二进制到底在哪、能否直接 invoke。
        # 失败也不会 fail step（CI 还能继续看 make bundle 报错）。
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: |
          echo "--- which/where tauri ---"
          which tauri 2>&1 || echo "WARN: tauri not in PATH"
          tauri --version 2>&1 || echo "WARN: tauri --version failed"
          echo "--- ls ~/.cargo/bin/ ---"
          ls -la ~/.cargo/bin/ 2>&1 | head -20 || echo "WARN: cannot list ~/.cargo/bin/"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
        shell: pwsh

      - name: Cache Pyodide wheel
        uses: actions/cache@v4
        with:
          path: web/node_modules/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pyodide-${{ runner.os }}-

      - name: Verify tools
        run: make check-tools

      - name: Build frontend
        # tauri::generate_context!() 编译期需要 web/dist 存在 (proc macro 嵌入
        # 前端资源)，必须先于 cargo test / clippy。Makefile 增量，cache hit
        # 时是 no-op；冷启要拉 Pyodide 离线 wheel ~30-60s。
        run: make build-frontend

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build Rust release
        run: make build-rust

      - name: Build platform bundle
        run: make bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: |
            target/release/bundle/
            target/release/mistake-agent*
          if-no-files-found: warn
          retention-days: 14
