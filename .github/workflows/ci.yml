name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            file

      - name: Cache tauri-cli binary
        # tauri-cli 是独立 crate，`cargo install` 每次编 2-3 min。
        # 按 runner OS 缓存到 ~/.cargo/bin/tauri[.exe]；key 固定为 2.x，
        # 想强制 invalidate 时改 -v1 → -v2。
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/tauri
            ~/.cargo/bin/tauri.exe
          key: tauri-cli-${{ runner.os }}-2.x-v1
          restore-keys: |
            tauri-cli-${{ runner.os }}-

      - name: Install tauri-cli (skip if cached)
        # `cargo install` 总是重编；用 PATH check 跳过 cache hit。
        # `cargo tauri build` 在 `make bundle` 中调用；runner 默认没装 tauri-cli，
        # 需 cargo install（Cargo.toml 只包含 tauri-build 作为 build dep）。
        run: |
          if ! command -v tauri &> /dev/null; then
            cargo install tauri-cli --version "^2.0"
          else
            echo "tauri-cli already cached at $(command -v tauri), skip install"
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
        shell: pwsh

      - name: Cache Pyodide wheel
        uses: actions/cache@v4
        with:
          path: web/node_modules/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pyodide-${{ runner.os }}-

      - name: Verify tools
        run: make check-tools

      - name: Build frontend
        # tauri::generate_context!() 编译期需要 web/dist 存在 (proc macro 嵌入
        # 前端资源)，必须先于 cargo test / clippy。Makefile 增量，cache hit
        # 时是 no-op；冷启要拉 Pyodide 离线 wheel ~30-60s。
        run: make build-frontend

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --all-targets --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build Rust release
        run: make build-rust

      - name: Build platform bundle
        run: make bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: |
            target/release/bundle/
            target/release/mistake-agent*
          if-no-files-found: warn
          retention-days: 14
