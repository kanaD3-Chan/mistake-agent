name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            file

      - name: Install tauri-cli
        # `cargo tauri build` 在 `make bundle` 中调用；runner 默认没装 tauri-cli，
        # 需 cargo install（Cargo.toml 只包含 tauri-build 作为 build dep）。
        run: cargo install tauri-cli --version "^2.0"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
        shell: pwsh

      - name: Cache Pyodide wheel
        uses: actions/cache@v4
        with:
          path: web/node_modules/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pyodide-${{ runner.os }}-

      - name: Build (frontend + Rust release + platform bundle)
        run: make

      - name: Upload Linux .AppImage + .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mistake-agent-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows NSIS .exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mistake-agent-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifact tree
        run: ls -R artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
