name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # 允许在 GitHub Actions UI 手动触发（用于修复 CI 后重跑，无需删 tag）

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            file

      - name: Cache tauri-cli binary
        # tauri-cli 是独立 crate，`cargo install` 每次编 2-3 min。
        # 按 runner OS 缓存；key 固定为 2.x，想强制 invalidate 时改 -v1 → -v2。
        # 跨平台：靠 actions/cache 的 `outputs.cache-hit` 判定，
        # 不写 shell 脚本（避免 Windows pwsh / Linux bash 语法差异）。
        #
        # path 用 OS 条件分支：actions/cache 的语义是 list 里所有路径都存在
        # 才保存；列两个（tauri + tauri.exe）→ 各自平台有一个不存在 →
        # "Path Validation Error"，不保存。所以单平台只列一个。
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/.cargo/bin/tauri.exe' || '~/.cargo/bin/tauri' }}
          key: tauri-cli-${{ runner.os }}-2.x-v1

      - name: Install tauri-cli (skip if cached)
        # `cargo tauri build` 在 `make bundle` 中调用；runner 默认没装 tauri-cli，
        # 需 cargo install（Cargo.toml 只包含 tauri-build 作为 build dep）。
        # cache-hit == 'true' 时 skip → 暖启省 2-3 min。
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0"

      - name: Verify tauri-cli install
        # 诊断：cargo install 跑完 tauri 二进制到底在哪、能否直接 invoke。
        # 失败也不会 fail step（CI 还能继续看 make bundle 报错）。
        if: steps.tauri-cache.outputs.cache-hit != 'true'
        run: |
          echo "--- which/where tauri ---"
          which tauri 2>&1 || echo "WARN: tauri not in PATH"
          tauri --version 2>&1 || echo "WARN: tauri --version failed"
          echo "--- ls ~/.cargo/bin/ ---"
          ls -la ~/.cargo/bin/ 2>&1 | head -20 || echo "WARN: cannot list ~/.cargo/bin/"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
        shell: pwsh

      - name: Cache Pyodide wheel
        uses: actions/cache@v4
        with:
          path: web/node_modules/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pyodide-${{ runner.os }}-

      - name: Build (frontend + Rust release + platform bundle)
        run: make

      - name: Upload Linux .AppImage + .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mistake-agent-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows NSIS .exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mistake-agent-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show artifact tree
        run: ls -R artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} (early test build)
          draft: true
          # 不使用 generate_release_notes —— 显式 body 更显眼地放 alpha 警告
          generate_release_notes: false
          body: |
            ## ⚠️ v0.1.0-alpha — 早期测试版

            **这是 Mistake Agent v2 的首个 alpha 预发布**。可能随时崩溃、数据可能丢失、
            API 与功能会在 v0.2.0 大幅调整。**不建议在生产环境或重要数据上使用**。

            ### 本版本内容

            - Windows NSIS 安装包：`mistake-agent_0.1.0_x64-setup.exe`
            - Linux AppImage + .deb
            - 源码：tag `v0.1.0-alpha`（commit 见链接的 commits tab）

            ### 详细变更与已知限制

            见 [CHANGELOG.md](https://github.com/kanaD3-Chan/mistake-agent/blob/v0.1.0-alpha/CHANGELOG.md)：
            - **Added**：5 个学习场景接入、kernel 完整栈、Windows 安装包实测、43 条 ADR
            - **Removed**：`so-lite-agent/` 已迁出至独立仓库
            - **Security & privacy**：AGPL-3.0；settings.json 明文存 API key（已知取舍）
            - **Known limitations**：场景 3/4/5 为 MVP 深度；错题存储/事件流/掌握度调度未做（v0.2.0 推进）

            ### 反馈问题

            走 [GitHub Issues](https://github.com/kanaD3-Chan/mistake-agent/issues)，
            请附 OS / 版本 / 复现步骤。
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
